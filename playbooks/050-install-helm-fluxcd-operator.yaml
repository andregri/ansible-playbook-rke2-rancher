- name: Install Flux CD Operator
  hosts: "{{ groups['control_plane'][0] }}"
  gather_facts: yes
  become: true
  tasks:
  - name: Install Flux CD helm chart
    ansible.builtin.command:
      cmd: |
        helm upgrade --install flux-operator oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
        --kubeconfig /etc/rancher/rke2/rke2.yaml
        --namespace flux-system
        --create-namespace
  
  - name: Wait for Flux Operator deployment
    ansible.builtin.command:
      cmd: |
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
        rollout status deployment/flux-operator
        -n flux-system
        --timeout=300s
    changed_when: false

  - name: Create Git credentials Secret
    ansible.builtin.shell:
      cmd: |
        set -o pipefail

        printf '%s' "$FLUX_GIT_TOKEN" |
        /var/lib/rancher/rke2/bin/kubectl \
          --kubeconfig /etc/rancher/rke2/rke2.yaml \
          create secret generic flux-system \
          --namespace=flux-system \
          --from-literal=username=git \
          --from-file=password=/dev/stdin \
          --dry-run=client -o yaml |
        /var/lib/rancher/rke2/bin/kubectl \
          --kubeconfig /etc/rancher/rke2/rke2.yaml \
          apply -f -
      executable: /bin/bash
    environment:
      FLUX_GIT_TOKEN: "{{ flux_git_token }}"
    no_log: true
    changed_when: false

  - name: Render FluxInstance manifest
    ansible.builtin.template:
      src: templates/flux-instance.yaml.j2
      dest: /tmp/flux-instance.yaml
      mode: '0600'

  - name: Apply FluxInstance
    ansible.builtin.command:
      cmd: |
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml apply -f /tmp/flux-instance.yaml
    register: flux_apply
    changed_when: "'created' in flux_apply.stdout or 'configured' in flux_apply.stdout"

  - name: Wait for FluxInstance
    ansible.builtin.command:
      cmd: |
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get fluxinstance flux -n flux-system
    register: flux_status
    retries: 30
    delay: 10
    until: flux_status.rc == 0
    changed_when: false

  - name: Check GitRepository synchronization
    ansible.builtin.command:
      argv:
        - /var/lib/rancher/rke2/bin/kubectl
        - --kubeconfig
        - /etc/rancher/rke2/rke2.yaml
        - get
        - gitrepository
        - flux-system
        - -n
        - flux-system
        - -o
        - jsonpath={.status.conditions[?(@.type=="Ready")].status}
    register: git_status
    retries: 30
    delay: 10
    until: git_status.stdout | trim == "True"
    changed_when: false

  - name: Display GitRepository status
    ansible.builtin.debug:
      msg: "Private Git repository successfully synchronized!"
  