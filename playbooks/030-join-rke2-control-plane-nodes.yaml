- name: Add other rke2 control plane nodes
  hosts: "{{ groups['control_plane'][1:] }}"
  gather_facts: yes
  become: true
  tasks:
    - name: Create rke2 config file
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/config.yaml
        content: |
          token: {{ rke2_shared_token }}
          server: https://{{ kube_vip }}:9345
          tls-san:
            - {{ kube_vip }}
            - {{ rancher_hostname }}
        owner: root
        group: root
        mode: '0644'
      become: true
    
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable rke2 service
      ansible.builtin.systemd:
        state: started
        name: rke2-server
        daemon_reload: true
        enabled: true