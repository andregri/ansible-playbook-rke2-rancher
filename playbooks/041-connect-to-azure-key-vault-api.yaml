- name: Connect to Key Vault
  hosts: "{{ groups['control_plane'][0] }}"
  gather_facts: yes

  vars:
    keyvault_url: "https://{{ keyvault_name }}.vault.azure.net"
    api_version: "7.4"

  tasks:
    # --------------------------------------------------
    # 1. Authenticate against Microsoft Entra ID
    # --------------------------------------------------

    - name: Request Azure access token
      ansible.builtin.uri:
        url: "https://login.microsoftonline.com/{{ tenant_id }}/oauth2/v2.0/token"
        method: POST
        body_format: form-urlencoded
        body:
          client_id: "{{ client_id }}"
          client_secret: "{{ client_secret }}"
          scope: "https://vault.azure.net/.default"
          grant_type: "client_credentials"
        headers:
          Content-Type: application/x-www-form-urlencoded
        return_content: true
        status_code: 200
      register: azure_auth
      no_log: true

    - name: Store Azure access token
      ansible.builtin.set_fact:
        azure_access_token: "{{ azure_auth.json.access_token }}"
      no_log: true

    # --------------------------------------------------
    # 2. GET SECRET FROM AZURE KEY VAULT
    # --------------------------------------------------

    - name: Retrieve flux-git-token secret from Azure Key Vault
      ansible.builtin.uri:
        url: "{{ keyvault_url }}/secrets/flux-git-token?api-version={{ api_version }}"
        method: GET
        headers:
          Authorization: "Bearer {{ azure_access_token }}"
          Content-Type: application/json
        return_content: true
        status_code: 200
      register: kv_get_result
      no_log: true
    
    - name: Store retrieved secret
      ansible.builtin.set_fact:
        flux_git_token: "{{ kv_get_result.json.value }}"
      no_log: true

    ### ---

    - name: Retrieve registry-username secret from Azure Key Vault
      ansible.builtin.uri:
        url: "{{ keyvault_url }}/secrets/registry-username?api-version={{ api_version }}"
        method: GET
        headers:
          Authorization: "Bearer {{ azure_access_token }}"
          Content-Type: application/json
        return_content: true
        status_code: 200
      register: kv_get_result
      no_log: true
    
    - name: Store retrieved secret
      ansible.builtin.set_fact:
        registry_username: "{{ kv_get_result.json.value }}"
      no_log: true

    ### ---

    - name: Retrieve registry-password secret from Azure Key Vault
      ansible.builtin.uri:
        url: "{{ keyvault_url }}/secrets/registry-password?api-version={{ api_version }}"
        method: GET
        headers:
          Authorization: "Bearer {{ azure_access_token }}"
          Content-Type: application/json
        return_content: true
        status_code: 200
      register: kv_get_result
      no_log: true
    
    - name: Store retrieved secret
      ansible.builtin.set_fact:
        registry_password: "{{ kv_get_result.json.value }}"
      no_log: true

    # --------------------------------------------------
    # 3. SET / UPDATE SECRET IN AZURE KEY VAULT
    # --------------------------------------------------

    # Read RKE2 kubeconfig
    - name: Read RKE2 kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/rke2/rke2.yaml
      register: rke2_kubeconfig
      no_log: true
      become: true

    # Store kubeconfig in Azure Key Vault
    - name: Create or update RKE2 kubeconfig in Azure Key Vault
      ansible.builtin.uri:
        url: "{{ keyvault_url }}/secrets/rke2-kubeconfig?api-version={{ api_version }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ azure_access_token }}"
          Content-Type: application/json
        body_format: json
        body:
          value: "{{ rke2_kubeconfig.content | b64decode }}"
        return_content: true
        status_code:
          - 200
          - 201
      register: kv_set_result
      no_log: true
