- name: Install rancher helm chart
  hosts: "{{ groups['control_plane'][0] }}"
  gather_facts: yes
  become: true
  tasks:
    - name: Get nodes
      ansible.builtin.shell:
        cmd: /var/lib/rancher/rke2/bin/kubectl get nodes --kubeconfig /etc/rancher/rke2/rke2.yaml
      become: true
      register: get_nodes
      changed_when: false

    - name: Print nodes
      ansible.builtin.debug:
        msg: "{{ get_nodes.stdout_lines }}"
      changed_when: false

    - name: Add Rancher helm repo
      ansible.builtin.shell:
        cmd: helm repo add rancher-stable https://releases.rancher.com/server-charts/stable
      become: true

    - name: Install rancher helm chart
      ansible.builtin.shell:
        cmd: |
          helm upgrade --install rancher rancher-stable/rancher \
          --namespace cattle-system \
          --create-namespace \
          --set hostname={{ rancher_hostname }} \
          --set bootstrapPassword=admin \
          --kubeconfig /etc/rancher/rke2/rke2.yaml
      become: true

    - name: Get rancher pod and svc
      ansible.builtin.shell:
        cmd: /var/lib/rancher/rke2/bin/kubectl get po,svc -A --kubeconfig /etc/rancher/rke2/rke2.yaml
      register: kubectl_get_po_cmd
      become: true
      changed_when: false
    
    - name: Print kubectl get output
      ansible.builtin.debug:
        msg: "{{ kubectl_get_po_cmd.stdout_lines }}"
      changed_when: false